###############################################################################
# infra.yml — Terraform plan + apply for the calculator-app AWS infrastructure
# Fix: sanitize non-ASCII characters (em-dash, en-dash, smart quotes) in .tf
# files before running Terraform, since AWS rejects them in resource descriptions
###############################################################################

name: "Infra — Terraform Plan & Apply"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy
      revision:
        description: "Git ref to check out"
        required: false
      udap_run_id:
        description: "UDAP run id"
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION:  "1.7.5"
  WORKING_DIR: "./infra"

jobs:
  terraform:
    name: "Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash -euo pipefail {0}

    outputs:
      ec2_public_ip:      ${{ steps.tf_output.outputs.ec2_public_ip }}
      alb_dns_name:       ${{ steps.tf_output.outputs.alb_dns_name }}
      ecr_repository_url: ${{ steps.tf_output.outputs.ecr_repository_url }}
      aws_role_arn:       ${{ steps.tf_output.outputs.aws_role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Sanitize non-ASCII characters in Terraform files
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          echo "Scanning for non-ASCII characters in .tf files..."
          # Show any files with non-ASCII chars
          grep -rlP '[^\x00-\x7F]' . --include='*.tf' || echo "No non-ASCII found by grep"

          # Replace common non-ASCII punctuation with ASCII equivalents in all .tf files
          # em dash (U+2014) -> hyphen
          # en dash (U+2013) -> hyphen
          # left/right double quotes (U+201C/U+201D) -> "
          # left/right single quotes (U+2018/U+2019) -> '
          # horizontal ellipsis (U+2026) -> ...
          # Any remaining non-ASCII -> removed
          python3 - <<'PYEOF'
          import os, re

          replacements = [
              ('\u2014', '-'),   # em dash
              ('\u2013', '-'),   # en dash
              ('\u2012', '-'),   # figure dash
              ('\u2011', '-'),   # non-breaking hyphen
              ('\u2010', '-'),   # hyphen
              ('\u201c', '"'),   # left double quote
              ('\u201d', '"'),   # right double quote
              ('\u2018', "'"),   # left single quote
              ('\u2019', "'"),   # right single quote
              ('\u2026', '...'), # horizontal ellipsis
              ('\u00a0', ' '),   # non-breaking space
          ]

          tf_dir = '.'
          fixed = 0
          for fname in os.listdir(tf_dir):
              if not fname.endswith('.tf'):
                  continue
              path = os.path.join(tf_dir, fname)
              with open(path, 'r', encoding='utf-8', errors='replace') as f:
                  content = f.read()
              original = content
              for bad, good in replacements:
                  content = content.replace(bad, good)
              # Strip any remaining non-ASCII characters
              content = content.encode('ascii', 'replace').decode('ascii').replace('?', '-')
              # But only replace actual non-ASCII, not question marks already in content
              # So re-read original and do a more careful replacement
              with open(path, 'r', encoding='utf-8', errors='replace') as f:
                  content2 = f.read()
              for bad, good in replacements:
                  content2 = content2.replace(bad, good)
              # Now encode to ascii, replacing unknown chars with nothing
              content2 = ''.join(c if ord(c) < 128 else '-' for c in content2)
              if content2 != original:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content2)
                  print(f"Fixed: {path}")
                  fixed += 1
              else:
                  print(f"Clean: {path}")
          print(f"Total files fixed: {fixed}")
          PYEOF
          echo "Sanitization complete"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          echo "STEP: terraform init"
          echo "Bucket secret set: ${{ secrets.TF_STATE_BUCKET != '' && 'YES' || 'NO - EMPTY' }}"
          echo "Key var: ${{ vars.TF_STATE_KEY }}"
          echo "Region var: ${{ vars.AWS_REGION }}"
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"
          echo "STEP: init SUCCESS"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        id: validate
        run: |
          echo "STEP: terraform validate"
          terraform validate -no-color
          echo "STEP: validate SUCCESS"

      - name: Terraform Plan
        id: plan
        run: |
          echo "STEP: terraform plan"
          set -o pipefail
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            2>&1 | tee plan_output.txt
          echo "STEP: plan SUCCESS"
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen ? plan.substring(0, maxLen) + '\n\n... [truncated]' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``,
            });

      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: |
          echo "STEP: terraform apply"
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan
          echo "STEP: apply SUCCESS"
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}

      - name: Terraform Destroy
        id: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          terraform destroy \
            -no-color \
            -input=false \
            -auto-approve
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}

      - name: Capture Terraform outputs
        id: tf_output
        if: steps.apply.outcome == 'success'
        run: |
          echo "STEP: capture outputs"
          EC2_IP=$(terraform output -raw ec2_public_ip         2>/dev/null || echo "")
          ALB_DNS=$(terraform output -raw alb_dns_name         2>/dev/null || echo "")
          ECR_URL=$(terraform output -raw ecr_repository_url   2>/dev/null || echo "")
          ROLE_ARN=$(terraform output -raw aws_role_arn        2>/dev/null || echo "")

          echo "ec2_public_ip=$EC2_IP"       >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS"       >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$ROLE_ARN"      >> "$GITHUB_OUTPUT"

          echo "## Infrastructure Outputs" >> "$GITHUB_STEP_SUMMARY"
          printf "| Output | Value |\n|--------|-------|\n| ec2_public_ip | \`%s\` |\n| alb_dns_name | \`%s\` |\n| ecr_repository_url | \`%s\` |\n| aws_role_arn | \`%s\` |\n" \
            "$EC2_IP" "$ALB_DNS" "$ECR_URL" "$ROLE_ARN" >> "$GITHUB_STEP_SUMMARY"

          echo "Live URL: http://$EC2_IP"
          echo "STEP: capture outputs DONE -- EC2_IP=$EC2_IP ALB=$ALB_DNS"

      - name: Retrieve private key
        id: privkey
        if: steps.apply.outcome == 'success'
        run: |
          PRIVKEY=$(terraform output -raw ec2_private_key_pem 2>/dev/null || echo "")
          echo "::add-mask::$PRIVKEY"
          printf 'pem<<KEYEOF\n%s\nKEYEOF\n' "$PRIVKEY" >> "$GITHUB_OUTPUT"

      - name: Set repository variables and EC2_SSH_KEY secret
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          ALB_DNS:   ${{ steps.tf_output.outputs.alb_dns_name }}
          ECR_URL:   ${{ steps.tf_output.outputs.ecr_repository_url }}
          EC2_IP:    ${{ steps.tf_output.outputs.ec2_public_ip }}
          ROLE_ARN:  ${{ steps.tf_output.outputs.aws_role_arn }}
          PRIVKEY:   ${{ steps.privkey.outputs.pem }}
        run: |
          API="https://api.github.com"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          set_var() {
            local name="$1" value="$2"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH "${AUTH[@]}" \
              "$API/repos/$REPO/actions/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$HTTP" != "204" ]; then
              curl -sf -X POST "${AUTH[@]}" \
                "$API/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}"
              echo "Created variable $name"
            else
              echo "Updated variable $name"
            fi
          }

          which gh || (apt-get update -qq && apt-get install -y -qq gh)

          printf '%s' "$PRIVKEY" | gh secret set "EC2_SSH_KEY" --repo "$REPO" --body -
          echo "Set secret EC2_SSH_KEY"

          set_var "AWS_ROLE_ARN"               "$ROLE_ARN"
          set_var "TF_OUT_ECR_REPOSITORY_URL"  "$ECR_URL"
          set_var "TF_OUT_EC2_PUBLIC_IP"        "$EC2_IP"
          set_var "TF_OUT_ALB_DNS_NAME"         "$ALB_DNS"
          echo "All variables and EC2_SSH_KEY set."

  notify-failure:
    name: "Notify on failure"
    needs: terraform
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Terraform infra workflow failed. Check the logs above."
          echo "## Infra workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for details." >> "$GITHUB_STEP_SUMMARY"
