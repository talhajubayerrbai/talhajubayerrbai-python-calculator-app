###############################################################################
# infra.yml — Terraform plan + apply for the calculator-app AWS infrastructure
# Simplified: removed aws-session-token, added per-step error capture
###############################################################################

name: "Infra — Terraform Plan & Apply"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: false
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy
      revision:
        description: "Git ref to check out"
        required: false
        default: ""
      udap_run_id:
        description: "UDAP run id"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION:  "1.7.5"
  WORKING_DIR: "./infra"
  TF_BUCKET:   "udap-calculator-tf-state-a7f3k9"
  TF_KEY:      "calculator/terraform.tfstate"
  TF_REGION:   "us-east-1"

jobs:
  terraform:
    name: "Terraform apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra

    outputs:
      ec2_public_ip:      ${{ steps.tf_output.outputs.ec2_public_ip }}
      alb_dns_name:       ${{ steps.tf_output.outputs.alb_dns_name }}
      ecr_repository_url: ${{ steps.tf_output.outputs.ecr_repository_url }}
      aws_role_arn:       ${{ steps.tf_output.outputs.aws_role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Verify AWS identity
        working-directory: .
        shell: bash
        run: |
          echo "::group::AWS identity"
          aws sts get-caller-identity && echo "AWS_AUTH=ok" || { echo "::error::AWS auth failed"; exit 1; }
          echo "::endgroup::"

      - name: Ensure S3 state bucket exists
        working-directory: .
        shell: bash
        run: |
          BUCKET="udap-calculator-tf-state-a7f3k9"
          REGION="us-east-1"
          echo "Checking bucket $BUCKET ..."
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket exists."
          else
            echo "Creating bucket $BUCKET ..."
            aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
              && echo "Bucket created." \
              || { echo "::error::Failed to create S3 bucket $BUCKET"; exit 1; }
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            us-east-1
        run: |
          echo "Running terraform init ..."
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=udap-calculator-tf-state-a7f3k9" \
            -backend-config="key=calculator/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            2>&1
          echo "Init exit: $?"

      - name: Terraform Validate
        shell: bash
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        shell: bash
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            us-east-1
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            2>&1
          echo "Plan exit: $?"

      - name: Terraform Apply
        id: apply
        shell: bash
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            us-east-1
        run: |
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan \
            2>&1
          echo "Apply exit: $?"

      - name: Capture Terraform outputs
        id: tf_output
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip       2>/dev/null || echo "")
          ALB_DNS=$(terraform output -raw alb_dns_name       2>/dev/null || echo "")
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || echo "")
          ROLE_ARN=$(terraform output -raw aws_role_arn      2>/dev/null || echo "")

          echo "ec2_public_ip=$EC2_IP"       >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS"       >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$ROLE_ARN"      >> "$GITHUB_OUTPUT"

          echo "EC2_IP=$EC2_IP  ALB=$ALB_DNS  ECR=$ECR_URL"
          echo "Live URL: http://$EC2_IP"

      - name: Retrieve private key
        id: privkey
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          PRIVKEY=$(terraform output -raw ec2_private_key_pem 2>/dev/null || echo "")
          echo "::add-mask::$PRIVKEY"
          printf 'pem<<KEYEOF\n%s\nKEYEOF\n' "$PRIVKEY" >> "$GITHUB_OUTPUT"

      - name: Set repository variables and EC2_SSH_KEY secret
        if: steps.apply.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          ALB_DNS:   ${{ steps.tf_output.outputs.alb_dns_name }}
          ECR_URL:   ${{ steps.tf_output.outputs.ecr_repository_url }}
          EC2_IP:    ${{ steps.tf_output.outputs.ec2_public_ip }}
          ROLE_ARN:  ${{ steps.tf_output.outputs.aws_role_arn }}
          PRIVKEY:   ${{ steps.privkey.outputs.pem }}
        run: |
          cd "$GITHUB_WORKSPACE"
          API="https://api.github.com"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          set_var() {
            local name="$1" value="$2"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH "${AUTH[@]}" \
              "$API/repos/$REPO/actions/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$HTTP" != "204" ]; then
              curl -sf -X POST "${AUTH[@]}" \
                "$API/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}"
              echo "Created $name"
            else
              echo "Updated $name"
            fi
          }

          which gh 2>/dev/null || (apt-get update -qq && apt-get install -y -qq gh)
          printf '%s' "$PRIVKEY" | gh secret set "EC2_SSH_KEY" --repo "$REPO" --body -

          set_var "TF_OUT_ECR_REPOSITORY_URL"  "$ECR_URL"
          set_var "TF_OUT_EC2_PUBLIC_IP"        "$EC2_IP"
          set_var "TF_OUT_ALB_DNS_NAME"         "$ALB_DNS"
          set_var "AWS_REGION"                  "us-east-1"
          echo "All variables set."

  notify-failure:
    name: "Notify on failure"
    needs: terraform
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Terraform infra workflow failed. Check the logs above."
