###############################################################################
# infra.yml — Terraform plan + apply for the calculator-app AWS infrastructure
#
# Triggers: push to main when any file under infra/ changes.
#
# Authentication: AWS credentials via the `udap-dev-aws` GitHub Actions secrets.
# Secrets required in this repository:
#   AWS_ACCESS_KEY_ID      — IAM user/role access key
#   AWS_SECRET_ACCESS_KEY  — IAM user/role secret key
#   AWS_REGION             — target region (us-east-1)
#
# After a successful apply, alb_dns_name and ecr_repository_url are stored as
# GitHub Actions repository variables (TF_OUT_ALB_DNS_NAME, TF_OUT_ECR_URL)
# for consumption by the application deploy workflow (Session 3).
###############################################################################

name: "Infra — Terraform Plan & Apply"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write   # allows the workflow to post plan output as a PR comment

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: "./infra"
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  terraform:
    name: "Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    outputs:
      ec2_public_ip:      ${{ steps.tf_output.outputs.ec2_public_ip }}
      alb_dns_name:       ${{ steps.tf_output.outputs.alb_dns_name }}
      ecr_repository_url: ${{ steps.tf_output.outputs.ecr_repository_url }}

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true   # enables ::output:: capture

      # -----------------------------------------------------------------------
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # -----------------------------------------------------------------------
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=udap-calculator-tf-state-a7f3k9" \
            -backend-config="key=calculator-app/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=udap-calculator-tf-lock"

      # -----------------------------------------------------------------------
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # -----------------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Post plan as a PR comment for review
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... [truncated]'
              : plan;
            const body = `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # -----------------------------------------------------------------------
      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: |
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      - name: Terraform Destroy
        id: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          terraform destroy \
            -no-color \
            -input=false \
            -auto-approve
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Capture outputs and persist as repo variables for the deploy workflow
      - name: Capture Terraform outputs
        id: tf_output
        if: steps.apply.outcome == 'success'
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip   2>/dev/null || echo "")
          ALB_DNS=$(terraform output -raw alb_dns_name   2>/dev/null || echo "")
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || echo "")

          echo "ec2_public_ip=$EC2_IP"       >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS"       >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"

          # Also surface as step summary
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Infrastructure Outputs
          | Output | Value |
          |--------|-------|
          | ec2_public_ip | \`$EC2_IP\` |
          | alb_dns_name | \`$ALB_DNS\` |
          | ecr_repository_url | \`$ECR_URL\` |
          EOF

      # -----------------------------------------------------------------------
      # Store outputs as GitHub Actions repository variables via the REST API
      # so the deploy workflow (Session 3) can read them without re-running Terraform.
      - name: Store outputs as repository variables
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          ALB_DNS:  ${{ steps.tf_output.outputs.alb_dns_name }}
          ECR_URL:  ${{ steps.tf_output.outputs.ecr_repository_url }}
          EC2_IP:   ${{ steps.tf_output.outputs.ec2_public_ip }}
        run: |
          set_var() {
            local name="$1"
            local value="$2"
            # Try PATCH (update) first, fall back to POST (create)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$STATUS" != "204" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}"
            fi
          }
          set_var "TF_OUT_ALB_DNS_NAME"       "$ALB_DNS"
          set_var "TF_OUT_ECR_REPOSITORY_URL" "$ECR_URL"
          set_var "TF_OUT_EC2_PUBLIC_IP"       "$EC2_IP"
          echo "Repository variables updated."

  # ---------------------------------------------------------------------------
  # Notify on failure
  notify-failure:
    name: "Notify on failure"
    needs: terraform
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Terraform infra workflow failed. Check the logs above for details."
          echo "## ❌ Infra workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for details." >> "$GITHUB_STEP_SUMMARY"
