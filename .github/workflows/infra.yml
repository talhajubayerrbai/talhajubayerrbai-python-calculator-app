###############################################################################
# infra.yml — Terraform plan + apply for the calculator-app AWS infrastructure
# Diagnostic version: all errors written to job summary for UDAP visibility
###############################################################################

name: "Infra — Terraform Plan & Apply"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy
      revision:
        description: "Git ref to check out"
        required: false
      udap_run_id:
        description: "UDAP run id"
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION:   "1.7.5"
  WORKING_DIR:  "./infra"
  TF_BUCKET:    "udap-calculator-tf-state-a7f3k9"
  TF_KEY:       "calculator/terraform.tfstate"
  TF_REGION:    "us-east-1"

jobs:
  terraform:
    name: "Terraform apply"
    runs-on: ubuntu-latest

    outputs:
      ec2_public_ip:      ${{ steps.tf_output.outputs.ec2_public_ip }}
      alb_dns_name:       ${{ steps.tf_output.outputs.alb_dns_name }}
      ecr_repository_url: ${{ steps.tf_output.outputs.ecr_repository_url }}
      aws_role_arn:       ${{ steps.tf_output.outputs.aws_role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          echo "## AWS Identity" >> "$GITHUB_STEP_SUMMARY"
          aws sts get-caller-identity 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ensure S3 state bucket exists
        run: |
          set -euo pipefail
          BUCKET="${{ env.TF_BUCKET }}"
          REGION="${{ env.TF_REGION }}"
          echo "## S3 Bucket Check: $BUCKET" >> "$GITHUB_STEP_SUMMARY"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Bucket $BUCKET not found — creating in $REGION..." | tee -a "$GITHUB_STEP_SUMMARY"
            aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Bucket $BUCKET created." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "## Terraform Init" >> "$GITHUB_STEP_SUMMARY"
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${{ env.TF_BUCKET }}" \
            -backend-config="key=${{ env.TF_KEY }}" \
            -backend-config="region=${{ env.TF_REGION }}" \
            -backend-config="encrypt=true" 2>&1 | tee /tmp/tf_init.log
          INIT_RC=${PIPESTATUS[0]}
          cat /tmp/tf_init.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$INIT_RC" -ne 0 ]; then
            echo "::error::TERRAFORM INIT FAILED — see job summary for full output"
            echo "### INIT FAILED" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/tf_init.log
            exit "$INIT_RC"
          fi
          echo "Init succeeded." >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION:            us-east-1

      - name: Terraform Validate
        id: validate
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "## Terraform Validate" >> "$GITHUB_STEP_SUMMARY"
          terraform validate -no-color 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "## Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            2>&1 | tee plan_output.txt
          PLAN_RC=${PIPESTATUS[0]}
          tail -50 plan_output.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN_RC" -ne 0 ]; then
            echo "::error::TERRAFORM PLAN FAILED — see job summary"
            echo "### PLAN FAILED" >> "$GITHUB_STEP_SUMMARY"
            cat plan_output.txt
            exit "$PLAN_RC"
          fi
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "## Terraform Apply" >> "$GITHUB_STEP_SUMMARY"
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan 2>&1 | tee apply_output.txt
          APPLY_RC=${PIPESTATUS[0]}
          tail -80 apply_output.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$APPLY_RC" -ne 0 ]; then
            echo "::error::TERRAFORM APPLY FAILED — see job summary"
            echo "### APPLY FAILED" >> "$GITHUB_STEP_SUMMARY"
            cat apply_output.txt
            exit "$APPLY_RC"
          fi
          echo "Apply succeeded." >> "$GITHUB_STEP_SUMMARY"
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Destroy
        id: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform destroy \
            -no-color \
            -input=false \
            -auto-approve
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Capture Terraform outputs
        id: tf_output
        if: steps.apply.outcome == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          EC2_IP=$(terraform output -raw ec2_public_ip         2>/dev/null || echo "")
          ALB_DNS=$(terraform output -raw alb_dns_name         2>/dev/null || echo "")
          ECR_URL=$(terraform output -raw ecr_repository_url   2>/dev/null || echo "")
          ROLE_ARN=$(terraform output -raw aws_role_arn        2>/dev/null || echo "")

          echo "ec2_public_ip=$EC2_IP"       >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS"       >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$ROLE_ARN"      >> "$GITHUB_OUTPUT"

          printf "| Output | Value |\n|--------|-------|\n| ec2_public_ip | \`%s\` |\n| alb_dns_name | \`%s\` |\n| ecr_repository_url | \`%s\` |\n| aws_role_arn | \`%s\` |\n" \
            "$EC2_IP" "$ALB_DNS" "$ECR_URL" "$ROLE_ARN" >> "$GITHUB_STEP_SUMMARY"

          echo "Live URL: http://$EC2_IP"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Retrieve private key
        id: privkey
        if: steps.apply.outcome == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          PRIVKEY=$(terraform output -raw ec2_private_key_pem 2>/dev/null || echo "")
          echo "::add-mask::$PRIVKEY"
          printf 'pem<<KEYEOF\n%s\nKEYEOF\n' "$PRIVKEY" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Set repository variables and EC2_SSH_KEY secret
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          API="https://api.github.com"
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO="${{ github.repository }}"
          ALB_DNS="${{ steps.tf_output.outputs.alb_dns_name }}"
          ECR_URL="${{ steps.tf_output.outputs.ecr_repository_url }}"
          EC2_IP="${{ steps.tf_output.outputs.ec2_public_ip }}"
          ROLE_ARN="${{ steps.tf_output.outputs.aws_role_arn }}"
          PRIVKEY="${{ steps.privkey.outputs.pem }}"

          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          set_var() {
            local name="$1" value="$2"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH "${AUTH[@]}" \
              "$API/repos/$REPO/actions/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$HTTP" != "204" ]; then
              curl -sf -X POST "${AUTH[@]}" \
                "$API/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}"
              echo "Created variable $name"
            else
              echo "Updated variable $name"
            fi
          }

          which gh || (apt-get update -qq && apt-get install -y -qq gh)
          printf '%s' "$PRIVKEY" | gh secret set "EC2_SSH_KEY" --repo "$REPO" --body -
          echo "Set secret EC2_SSH_KEY"

          set_var "AWS_ROLE_ARN"               "$ROLE_ARN"
          set_var "TF_OUT_ECR_REPOSITORY_URL"  "$ECR_URL"
          set_var "TF_OUT_EC2_PUBLIC_IP"        "$EC2_IP"
          set_var "TF_OUT_ALB_DNS_NAME"         "$ALB_DNS"
          set_var "AWS_REGION"                  "us-east-1"
          echo "All variables and EC2_SSH_KEY set."

  notify-failure:
    name: "Notify on failure"
    needs: terraform
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Terraform infra workflow failed. Check the logs above."
          echo "## Infra workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for details." >> "$GITHUB_STEP_SUMMARY"
