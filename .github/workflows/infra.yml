###############################################################################
# infra.yml — Terraform plan + apply for the calculator-app AWS infrastructure
###############################################################################

name: "Infra — Terraform Plan & Apply"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy
      revision:
        description: "Git ref to check out"
        required: false
      udap_run_id:
        description: "UDAP run id"
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION:   "1.7.5"
  WORKING_DIR:  "./infra"
  TF_BUCKET:    "udap-calculator-tf-state-a7f3k9"
  TF_KEY:       "calculator/terraform.tfstate"
  TF_REGION:    "us-east-1"

jobs:
  terraform:
    name: "Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash -euo pipefail {0}

    outputs:
      ec2_public_ip:      ${{ steps.tf_output.outputs.ec2_public_ip }}
      alb_dns_name:       ${{ steps.tf_output.outputs.alb_dns_name }}
      ecr_repository_url: ${{ steps.tf_output.outputs.ecr_repository_url }}
      aws_role_arn:       ${{ steps.tf_output.outputs.aws_role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Verify AWS identity
        shell: bash
        working-directory: .
        run: |
          echo "=== AWS caller identity ==="
          aws sts get-caller-identity
          echo "=== S3 bucket check ==="
          aws s3api head-bucket --bucket "${{ env.TF_BUCKET }}" 2>&1 || \
            echo "WARNING: bucket check returned non-zero (bucket may not exist yet)"
          echo "=== Listing S3 buckets ==="
          aws s3 ls 2>&1 | grep -i "udap\|calculator\|terraform\|state" || echo "(no matching buckets found)"

      - name: Ensure S3 state bucket exists
        shell: bash
        working-directory: .
        run: |
          BUCKET="${{ env.TF_BUCKET }}"
          REGION="${{ env.TF_REGION }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists."
          else
            echo "Creating bucket $BUCKET in $REGION..."
            aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "Bucket $BUCKET created."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          echo "=== terraform init ==="
          echo "  Bucket: ${{ env.TF_BUCKET }}"
          echo "  Key:    ${{ env.TF_KEY }}"
          echo "  Region: ${{ env.TF_REGION }}"
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${{ env.TF_BUCKET }}" \
            -backend-config="key=${{ env.TF_KEY }}" \
            -backend-config="region=${{ env.TF_REGION }}" \
            -backend-config="encrypt=true" 2>&1 | tee /tmp/tf_init.log
          INIT_RC=${PIPESTATUS[0]}
          if [ "$INIT_RC" -ne 0 ]; then
            echo "::error::terraform init failed:"
            cat /tmp/tf_init.log
            exit "$INIT_RC"
          fi
          echo "=== init SUCCESS ==="
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION:            us-east-1

      - name: Terraform Validate
        id: validate
        run: |
          echo "STEP: terraform validate"
          terraform validate -no-color
          echo "STEP: validate SUCCESS"

      - name: Terraform Plan
        id: plan
        run: |
          echo "STEP: terraform plan"
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            2>&1 | tee plan_output.txt
          PLAN_RC=${PIPESTATUS[0]}
          if [ "$PLAN_RC" -ne 0 ]; then
            echo "::error::terraform plan failed:"
            cat plan_output.txt
            exit "$PLAN_RC"
          fi
          echo "STEP: plan SUCCESS"
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen ? plan.substring(0, maxLen) + '\n\n... [truncated]' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``,
            });

      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: |
          echo "STEP: terraform apply"
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan
          echo "STEP: apply SUCCESS"
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Destroy
        id: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          terraform destroy \
            -no-color \
            -input=false \
            -auto-approve
        env:
          TF_VAR_aws_region:     us-east-1
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Capture Terraform outputs
        id: tf_output
        if: steps.apply.outcome == 'success'
        run: |
          echo "STEP: capture outputs"
          EC2_IP=$(terraform output -raw ec2_public_ip         2>/dev/null || echo "")
          ALB_DNS=$(terraform output -raw alb_dns_name         2>/dev/null || echo "")
          ECR_URL=$(terraform output -raw ecr_repository_url   2>/dev/null || echo "")
          ROLE_ARN=$(terraform output -raw aws_role_arn        2>/dev/null || echo "")

          echo "ec2_public_ip=$EC2_IP"       >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS"       >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$ROLE_ARN"      >> "$GITHUB_OUTPUT"

          echo "## Infrastructure Outputs" >> "$GITHUB_STEP_SUMMARY"
          printf "| Output | Value |\n|--------|-------|\n| ec2_public_ip | \`%s\` |\n| alb_dns_name | \`%s\` |\n| ecr_repository_url | \`%s\` |\n| aws_role_arn | \`%s\` |\n" \
            "$EC2_IP" "$ALB_DNS" "$ECR_URL" "$ROLE_ARN" >> "$GITHUB_STEP_SUMMARY"

          echo "Live URL: http://$EC2_IP"
          echo "STEP: capture outputs DONE -- EC2_IP=$EC2_IP ALB=$ALB_DNS"

      - name: Retrieve private key
        id: privkey
        if: steps.apply.outcome == 'success'
        run: |
          PRIVKEY=$(terraform output -raw ec2_private_key_pem 2>/dev/null || echo "")
          echo "::add-mask::$PRIVKEY"
          printf 'pem<<KEYEOF\n%s\nKEYEOF\n' "$PRIVKEY" >> "$GITHUB_OUTPUT"

      - name: Set repository variables and EC2_SSH_KEY secret
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          REPO:      ${{ github.repository }}
          ALB_DNS:   ${{ steps.tf_output.outputs.alb_dns_name }}
          ECR_URL:   ${{ steps.tf_output.outputs.ecr_repository_url }}
          EC2_IP:    ${{ steps.tf_output.outputs.ec2_public_ip }}
          ROLE_ARN:  ${{ steps.tf_output.outputs.aws_role_arn }}
          PRIVKEY:   ${{ steps.privkey.outputs.pem }}
        run: |
          API="https://api.github.com"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          set_var() {
            local name="$1" value="$2"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH "${AUTH[@]}" \
              "$API/repos/$REPO/actions/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$HTTP" != "204" ]; then
              curl -sf -X POST "${AUTH[@]}" \
                "$API/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}"
              echo "Created variable $name"
            else
              echo "Updated variable $name"
            fi
          }

          which gh || (apt-get update -qq && apt-get install -y -qq gh)

          printf '%s' "$PRIVKEY" | gh secret set "EC2_SSH_KEY" --repo "$REPO" --body -
          echo "Set secret EC2_SSH_KEY"

          set_var "AWS_ROLE_ARN"               "$ROLE_ARN"
          set_var "TF_OUT_ECR_REPOSITORY_URL"  "$ECR_URL"
          set_var "TF_OUT_EC2_PUBLIC_IP"        "$EC2_IP"
          set_var "TF_OUT_ALB_DNS_NAME"         "$ALB_DNS"
          set_var "AWS_REGION"                  "us-east-1"
          echo "All variables and EC2_SSH_KEY set."

  notify-failure:
    name: "Notify on failure"
    needs: terraform
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Terraform infra workflow failed. Check the logs above."
          echo "## Infra workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for details." >> "$GITHUB_STEP_SUMMARY"
