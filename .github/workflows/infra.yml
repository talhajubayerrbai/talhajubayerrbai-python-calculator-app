###############################################################################
# infra.yml — Terraform plan + apply for the calculator-app AWS infrastructure
###############################################################################

name: "Infra — Terraform Plan & Apply"

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy
      revision:
        description: "Git ref to check out"
        required: false
      udap_run_id:
        description: "UDAP run id"
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION:  "1.7.5"
  WORKING_DIR: "./infra"
  TF_BUCKET:   "udap-calculator-tf-state-a7f3k9"
  TF_KEY:      "calculator/terraform.tfstate"
  TF_REGION:   "us-east-1"

jobs:
  terraform:
    name: "Terraform apply"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION:    "us-east-1"

    outputs:
      ec2_public_ip:      ${{ steps.tf_output.outputs.ec2_public_ip }}
      alb_dns_name:       ${{ steps.tf_output.outputs.alb_dns_name }}
      ecr_repository_url: ${{ steps.tf_output.outputs.ecr_repository_url }}
      aws_role_arn:       ${{ steps.tf_output.outputs.aws_role_arn }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      # ── 2. AWS credentials ───────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      # ── 3. Setup Terraform ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ── 4. Terraform Init — capture to /tmp/tf_init.log ──────────────────────
      - name: Terraform Init
        id: init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${{ env.TF_BUCKET }}" \
            -backend-config="key=${{ env.TF_KEY }}" \
            -backend-config="region=${{ env.TF_REGION }}" \
            -backend-config="encrypt=true" 2>&1 | tee /tmp/tf_init.log
          echo "TF_INIT_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # ── 5. Terraform Plan ────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan 2>&1 | tee /tmp/tf_plan.log
          echo "TF_PLAN_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        env:
          TF_VAR_aws_region: us-east-1

      # ── 6. Terraform Apply ───────────────────────────────────────────────────
      - name: Terraform Apply
        id: apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply \
            -no-color \
            -input=false \
            -auto-approve \
            tfplan 2>&1 | tee /tmp/tf_apply.log
          echo "TF_APPLY_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        env:
          TF_VAR_aws_region: us-east-1

      # ── 7. Capture outputs ───────────────────────────────────────────────────
      - name: Capture Terraform outputs
        id: tf_output
        if: steps.apply.outcome == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip         2>/dev/null || echo "")
          ALB_DNS=$(terraform output -raw alb_dns_name         2>/dev/null || echo "")
          ECR_URL=$(terraform output -raw ecr_repository_url   2>/dev/null || echo "")
          ROLE_ARN=$(terraform output -raw aws_role_arn        2>/dev/null || echo "")

          echo "ec2_public_ip=$EC2_IP"       >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS"       >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$ROLE_ARN"      >> "$GITHUB_OUTPUT"

          echo "Live URL: http://$EC2_IP"

      # ── 8. Retrieve private key ──────────────────────────────────────────────
      - name: Retrieve private key
        id: privkey
        if: steps.apply.outcome == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          PRIVKEY=$(terraform output -raw ec2_private_key_pem 2>/dev/null || echo "")
          echo "::add-mask::$PRIVKEY"
          printf 'pem<<KEYEOF\n%s\nKEYEOF\n' "$PRIVKEY" >> "$GITHUB_OUTPUT"

      # ── 9. Set repo variables ────────────────────────────────────────────────
      - name: Set repository variables and EC2_SSH_KEY secret
        if: steps.apply.outcome == 'success'
        run: |
          API="https://api.github.com"
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO="${{ github.repository }}"
          ALB_DNS="${{ steps.tf_output.outputs.alb_dns_name }}"
          ECR_URL="${{ steps.tf_output.outputs.ecr_repository_url }}"
          EC2_IP="${{ steps.tf_output.outputs.ec2_public_ip }}"
          ROLE_ARN="${{ steps.tf_output.outputs.aws_role_arn }}"
          PRIVKEY="${{ steps.privkey.outputs.pem }}"

          set_var() {
            local name="$1" value="$2"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/actions/variables/$name" \
              -d "{\"name\":\"$name\",\"value\":\"$value\"}")
            if [ "$HTTP" != "204" ]; then
              curl -sf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$name\",\"value\":\"$value\"}"
              echo "Created variable $name"
            else
              echo "Updated variable $name"
            fi
          }

          which gh || (apt-get update -qq && apt-get install -y -qq gh)
          printf '%s' "$PRIVKEY" | gh secret set "EC2_SSH_KEY" --repo "$REPO" --body -
          echo "Set secret EC2_SSH_KEY"

          set_var "AWS_ROLE_ARN"               "$ROLE_ARN"
          set_var "TF_OUT_ECR_REPOSITORY_URL"  "$ECR_URL"
          set_var "TF_OUT_EC2_PUBLIC_IP"        "$EC2_IP"
          set_var "TF_OUT_ALB_DNS_NAME"         "$ALB_DNS"
          set_var "AWS_REGION"                  "us-east-1"
          echo "All variables and EC2_SSH_KEY set."

      # ── ALWAYS: dump all captured logs to summary ────────────────────────────
      - name: Dump logs to job summary (always)
        if: always()
        run: |
          echo "## Terraform Log Dump" >> "$GITHUB_STEP_SUMMARY"
          echo "### Init log (exit=${TF_INIT_EXIT:-not_run})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tf_init.log  >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no init log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Plan log (exit=${TF_PLAN_EXIT:-not_run})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tf_plan.log  >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no plan log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Apply log (exit=${TF_APPLY_EXIT:-not_run})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tf_apply.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no apply log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "FULL_LOG_DUMP_COMPLETE"

  notify-failure:
    name: "Notify on failure"
    needs: terraform
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Annotate failure
        run: |
          echo "::error::Terraform infra workflow failed. Check the logs above."
          echo "## Infra workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for details." >> "$GITHUB_STEP_SUMMARY"
