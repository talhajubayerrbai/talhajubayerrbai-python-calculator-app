###############################################################################
# deploy.yml — Build, push to ECR, and deploy to RKE2 via Helm
#
# Session 3: wires CI → CD for the python-calculator-app.
#
# Prerequisites (set once by an admin):
#   Repository variables  (Settings → Secrets and variables → Actions → Variables):
#     AWS_ROLE_ARN            — IAM role ARN for OIDC authentication
#     TF_OUT_ECR_REPOSITORY_URL — set by infra.yml after terraform apply
#     TF_OUT_EC2_PUBLIC_IP      — set by infra.yml after terraform apply
#     TF_OUT_ALB_DNS_NAME       — set by infra.yml after terraform apply
#
#   Repository secrets    (Settings → Secrets and variables → Actions → Secrets):
#     EC2_SSH_KEY             — PEM private key for SSH into the EC2 instance
#
# Flow:
#   1. Authenticate to AWS via OIDC (no static credentials)
#   2. Log in to ECR
#   3. Build and push Docker image (tags: latest + 7-char SHA)
#   4. SSH into EC2, patch kubeconfig, run helm upgrade --install
#   5. Smoke-test the ALB /health endpoint
###############################################################################

name: "Deploy — Build, Push & Helm Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - "charts/**"
  workflow_dispatch:

# Required for OIDC token issuance
permissions:
  id-token: write   # allow GitHub to issue an OIDC token
  contents: read    # allow checkout

env:
  AWS_REGION:     us-east-1
  IMAGE_NAME:     calculator-app
  HELM_RELEASE:   calculator
  HELM_CHART_DIR: ./charts/calculator
  HELM_TIMEOUT:   5m
  NODE_PORT:      "30080"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job: deploy
  #   Builds the image, pushes to ECR, deploys via Helm on the RKE2 node.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Build → Push → Helm Deploy"
    runs-on: ubuntu-latest

    steps:
      # ── 0. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Compute short SHA ─────────────────────────────────────────────────
      - name: Compute short SHA
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Short SHA: $SHORT_SHA"

      # ── 2. Authenticate to AWS via OIDC ──────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  ${{ vars.AWS_ROLE_ARN }}
          aws-region:      ${{ env.AWS_REGION }}

      # ── 3. Log in to Amazon ECR ──────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build Docker image ─────────────────────────────────────────────────
      - name: Build Docker image
        env:
          ECR_URL: ${{ vars.TF_OUT_ECR_REPOSITORY_URL }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          echo "Building image: $ECR_URL:$SHORT_SHA"
          docker build \
            --tag "$ECR_URL:$SHORT_SHA" \
            --tag "$ECR_URL:latest" \
            --file Dockerfile \
            .

      # ── 5. Push image to ECR (both tags) ─────────────────────────────────────
      - name: Push image to ECR
        env:
          ECR_URL: ${{ vars.TF_OUT_ECR_REPOSITORY_URL }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          echo "Pushing $ECR_URL:$SHORT_SHA ..."
          docker push "$ECR_URL:$SHORT_SHA"
          echo "Pushing $ECR_URL:latest ..."
          docker push "$ECR_URL:latest"
          echo "✓ Both tags pushed to ECR"

      # ── 6. Deploy via Helm on the RKE2 node (SSH) ────────────────────────────
      #
      # We SSH into the EC2 instance (which is also the single RKE2 node),
      # patch the kubeconfig server address to loopback so TLS works, then
      # run helm upgrade --install from the checked-out chart directory.
      #
      # The chart directory is copied via scp before the helm command runs.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        env:
          EC2_IP: ${{ vars.TF_OUT_EC2_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Scan and record the host key so StrictHostKeyChecking passes
          ssh-keyscan -H "$EC2_IP" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "✓ Host key recorded for $EC2_IP"

      - name: Copy Helm chart to EC2 instance
        env:
          EC2_IP: ${{ vars.TF_OUT_EC2_PUBLIC_IP }}
        run: |
          echo "Copying charts/ to EC2 instance..."
          # Remove any stale copy, then transfer the current chart tree
          ssh ec2-user@"$EC2_IP" "rm -rf ~/charts"
          scp -r charts/ ec2-user@"$EC2_IP":~/charts
          echo "✓ Chart directory copied"

      - name: Helm upgrade --install on RKE2 node
        env:
          EC2_IP:    ${{ vars.TF_OUT_EC2_PUBLIC_IP }}
          ECR_URL:   ${{ vars.TF_OUT_ECR_REPOSITORY_URL }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          ssh ec2-user@"$EC2_IP" bash -s <<'ENDSSH'
            set -euo pipefail

            # ── Patch kubeconfig server address to loopback ──────────────────
            KUBECONFIG_SRC=/etc/rancher/rke2/rke2.yaml
            KUBECONFIG_DEST=$HOME/.kube/config

            mkdir -p "$HOME/.kube"
            sudo cp "$KUBECONFIG_SRC" "$KUBECONFIG_DEST"
            sudo chown "$(id -u):$(id -g)" "$KUBECONFIG_DEST"
            chmod 600 "$KUBECONFIG_DEST"

            # Replace whatever server address Terraform wrote with loopback
            sed -i 's|https://[^"]*:6443|https://127.0.0.1:6443|g' "$KUBECONFIG_DEST"
            echo "✓ kubeconfig patched — server: https://127.0.0.1:6443"

            export KUBECONFIG="$KUBECONFIG_DEST"

            # ── Verify cluster is reachable before deploying ─────────────────
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig "$KUBECONFIG_DEST" get nodes
            echo "✓ Cluster is reachable"
          ENDSSH

          # Pass ECR_URL and SHORT_SHA into the remote shell explicitly
          # (heredoc variables expanded on the runner, not on the remote)
          ssh ec2-user@"$EC2_IP" \
            ECR_URL="$ECR_URL" \
            SHORT_SHA="$SHORT_SHA" \
            NODE_PORT="${{ env.NODE_PORT }}" \
            HELM_RELEASE="${{ env.HELM_RELEASE }}" \
            bash -s <<'ENDSSH'
            set -euo pipefail

            export KUBECONFIG="$HOME/.kube/config"
            export PATH="/usr/local/bin:/var/lib/rancher/rke2/bin:$PATH"

            echo "Deploying image: $ECR_URL:$SHORT_SHA"
            echo "Helm release:    $HELM_RELEASE"
            echo "Node port:       $NODE_PORT"

            helm upgrade --install "$HELM_RELEASE" ~/charts/calculator \
              --set image.repository="$ECR_URL" \
              --set image.tag="$SHORT_SHA" \
              --set service.nodePort="$NODE_PORT" \
              --wait \
              --timeout 5m \
              --atomic

            echo "✓ Helm deploy complete"
            helm status "$HELM_RELEASE"
          ENDSSH

      # ── 7. Smoke-test: curl the ALB /health endpoint ─────────────────────────
      - name: Smoke test — ALB /health
        env:
          ALB_DNS: ${{ vars.TF_OUT_ALB_DNS_NAME }}
        run: |
          echo "Smoke-testing http://$ALB_DNS/health ..."
          # Allow up to 60 s for the ALB to route to the new pod
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl --silent --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 10 \
              "http://$ALB_DNS/health" || true)
            echo "Attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              BODY=$(curl --silent --fail --max-time 10 "http://$ALB_DNS/health")
              echo "Response body: $BODY"
              echo "$BODY" | python3 -c "
          import sys, json
          body = json.load(sys.stdin)
          assert body == {'status': 'ok'}, f'Unexpected: {body}'
          print('✓ /health → {\"status\": \"ok\"}')"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "::error::ALB /health did not return 200 after 60 s"
              exit 1
            fi
            sleep 5
          done

      # ── 8. Job summary ────────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        env:
          ECR_URL:   ${{ vars.TF_OUT_ECR_REPOSITORY_URL }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          ALB_DNS:   ${{ vars.TF_OUT_ALB_DNS_NAME }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Deploy succeeded

          | Item | Value |
          |------|-------|
          | Image | \`$ECR_URL:$SHORT_SHA\` |
          | Tags pushed | \`$SHORT_SHA\`, \`latest\` |
          | Helm release | \`${{ env.HELM_RELEASE }}\` |
          | ALB endpoint | http://$ALB_DNS |
          | Smoke test | ✅ /health → {"status":"ok"} |
          EOF
